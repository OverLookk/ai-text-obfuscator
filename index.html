<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Text Obfuscator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      width: min(700px, 90vw);
      background: #020617;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid #1f2937;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.75rem;
    }
    label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
    }
    textarea {
      width: 100%;
      min-height: 80px;
      padding: 0.75rem;
      margin-top: 0.35rem;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      resize: vertical;
      outline: none;
      font-size: 0.95rem;
    }
    textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px #38bdf8;
    }
    .output-wrapper {
      margin-top: 1rem;
      position: relative;
    }
    .output-box {
      width: 100%;
      min-height: 80px;
      padding: 0.75rem;
      margin-top: 0.35rem;
      border-radius: 0.75rem;
      border: 1px solid #1f2937;
      background: #020617;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
      justify-content: flex-end;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      background: #38bdf8;
      color: #020617;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    button:active {
      transform: scale(0.97);
    }
    .secondary {
      background: #111827;
      color: #e5e7eb;
    }
    .hint {
      font-size: 0.75rem;
      color: #6b7280;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Text Obfuscator</h1>
    <p class="hint">Example: <code>i like pizza</code> → <code>-ⓘ- -ⓛ-ⓘ-ⓚ-ⓔ- -ⓟ-ⓘ-ⓩ-ⓩ-ⓐ-</code></p>

    <label for="input">Input</label>
    <textarea id="input" placeholder="Type or paste your text here..."></textarea>

    <div class="output-wrapper">
      <label for="output">Obfuscated</label>
      <div id="output" class="output-box"></div>
    </div>

    <div class="controls">
      <button id="copyBtn" type="button">Copy</button>
      <button id="clearBtn" type="button" class="secondary">Clear</button>
    </div>
  </div>

  <script>
    const inputEl = document.getElementById('input');
    const outputEl = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const clearBtn = document.getElementById('clearBtn');

    // Map a-z to circled small letters
    const circleMap = {
      a: 'ⓐ', b: 'ⓑ', c: 'ⓒ', d: 'ⓓ', e: 'ⓔ',
      f: 'ⓕ', g: 'ⓖ', h: 'ⓗ', i: 'ⓘ', j: 'ⓙ',
      k: 'ⓚ', l: 'ⓛ', m: 'ⓜ', n: 'ⓝ', o: 'ⓞ',
      p: 'ⓟ', q: 'ⓠ', r: 'ⓡ', s: 'ⓢ', t: 'ⓣ',
      u: 'ⓤ', v: 'ⓥ', w: 'ⓦ', x: 'ⓧ', y: 'ⓨ',
      z: 'ⓩ'
    };

    function obfuscate(text) {
      return text
        .split('')
        .map(ch => {
          if (ch === ' ') return ' ';
          const lower = ch.toLowerCase();
          const mapped = circleMap[lower] || ch;
          return '-' + mapped + '-';
        })
        .join('');
    }

    inputEl.addEventListener('input', () => {
      const text = inputEl.value;
      outputEl.textContent = obfuscate(text);
    });

    copyBtn.addEventListener('click', async () => {
      const text = outputEl.textContent || '';
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copied!';
        setTimeout(() => (copyBtn.textContent = 'Copy'), 800);
      } catch (e) {
        alert('Could not copy to clipboard in this browser.');
      }
    });

    clearBtn.addEventListener('click', () => {
      inputEl.value = '';
      outputEl.textContent = '';
    });
  </script>
</body>
</html>
